name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: 后端构建与单测
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/server

    steps:
      - uses: actions/checkout@v4

      # 本地开发用的 Go 工具链版本较新，go.mod 声明的版本号在 CI 上可能没有，
      # 所以先安装 stable，再放宽 go 指令后编译
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: backend/server/go.sum

      - name: 放宽 go 指令
        run: go mod edit -go=1.22

      - name: 下载依赖
        run: go mod download

      - name: 编译
        run: go build ./...

      - name: 单元测试
        run: go test ./service/lead/... -v

      - name: go vet
        run: go vet ./service/lead/... ./initialize/...
        continue-on-error: true

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 构建
        run: pnpm build

  scripts:
    name: 脚本语法检查
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python 语法检查
        run: |
          python -m compileall -q scripts/*.py


      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: PowerShell 脚本语法检查
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              Write-Host "FAIL: $($_.Name)"
              $parseErrors | ForEach-Object { Write-Host "  $($_.Message)" }
              $errors++
            }
          }
          if ($errors -gt 0) { exit 1 }
          Write-Host "所有 ps1 脚本语法通过"